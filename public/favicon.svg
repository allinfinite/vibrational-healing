<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#134e4a"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#99f6e4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Outer wave ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#wave1)" stroke-width="8" opacity="0.3"/>
  
  <!-- Middle wave ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#wave1)" stroke-width="10" opacity="0.5"/>
  
  <!-- Inner wave ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#wave2)" stroke-width="12" opacity="0.7"/>
  
  <!-- Core glow -->
  <circle cx="256" cy="256" r="60" fill="url(#wave1)" opacity="0.4"/>
  
  <!-- Central point -->
  <circle cx="256" cy="256" r="35" fill="url(#core)"/>
  
  <!-- Sound wave lines (vertical) -->
  <g stroke="url(#wave2)" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="120" x2="256" y2="160"/>
    <line x1="256" y1="352" x2="256" y2="392"/>
  </g>
  
  <!-- Sound wave lines (horizontal) -->
  <g stroke="url(#wave2)" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="256" x2="160" y2="256"/>
    <line x1="352" y1="256" x2="392" y2="256"/>
  </g>
  
  <!-- Diagonal accents -->
  <g stroke="url(#wave1)" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="160" y1="160" x2="185" y2="185"/>
    <line x1="352" y1="160" x2="327" y2="185"/>
    <line x1="160" y1="352" x2="185" y2="327"/>
    <line x1="352" y1="352" x2="327" y2="327"/>
  </g>
</svg>

